name: Production-backed mobile acceptance

jobs:
  validate:
    name: Validate mobile release source
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run:
          name: Validate release configuration
          command: pnpm release:check
      - run:
          name: Check mobile types
          command: pnpm type-check
      - run:
          name: Run mobile unit tests
          command: pnpm test:run

  build_android:
    name: Build signed Android acceptance app
    needs: [validate]
    type: build
    params:
      platform: android
      profile: acceptance

  build_ios:
    name: Build signed iOS acceptance app
    needs: [validate]
    type: build
    params:
      platform: ios
      profile: acceptance
