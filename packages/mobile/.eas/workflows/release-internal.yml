name: Release mobile apps to internal testing

jobs:
  build_android:
    name: Build signed Android release
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build signed iOS release
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Release Android to internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS build to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
