appId: com.groupi.mobile
name: Signed-out invite deep link
tags:
  - smoke
  - deep-link
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: 'groupi://invite/e2e-automation-invite'
- runFlow:
    when:
      visible: 'Open in.*Groupi'
    commands:
      - tapOn: '^Open$'
- openLink: 'groupi://invite/e2e-automation-invite'
- assertVisible: 'Sign in to accept invite'
- tapOn: 'Sign in to accept this invite'
- assertVisible: 'Groupi'
- assertVisible: 'Continue with Email'
- assertNotVisible: 'Invalid Invite'
