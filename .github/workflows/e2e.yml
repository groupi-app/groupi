name: E2E Tests

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Isolated preview HTTPS origin (test.groupi.gg or preview alias)'
        required: true
        type: string
      expected_sha:
        description: 'Full deployed commit SHA; tests check out this exact revision'
        required: true
        type: string
      convex_url:
        description: 'Expected isolated Convex preview HTTPS origin'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Public preview readiness (not authenticated E2E)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.production_environment == false)
    runs-on: ubuntu-latest
    outputs:
      convex_url: ${{ steps.check.outputs.convex_url }}
    steps:
      # Use workflow revision for read-only validation, not deployed PR code.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test readiness gate
        run: node --test scripts/verification-readiness.test.mjs
      - name: Verify deployment and backend
        id: check
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.deployment.sha }}
          EXPECTED_BACKEND: ${{ inputs.convex_url }}
        run: |
          node scripts/verification-readiness.mjs "$DEPLOYMENT_URL" "$EXPECTED_SHA" "$EXPECTED_BACKEND" > readiness.json
          echo "convex_url=$(jq -r '.web.backend' readiness.json)" >> "$GITHUB_OUTPUT"
          echo 'Public prerequisites passed. Signed-in browser and native/VoiceOver checks remain unverified.' >> "$GITHUB_STEP_SUMMARY"
          cat readiness.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-readiness
          path: readiness.json

  e2e:
    name: Authenticated E2E (${{ matrix.browser }})
    # Fixture tests mutate isolated data. Keep them explicitly requested until
    # deployed fixture configuration and email isolation have been verified.
    if: github.event_name == 'workflow_dispatch'
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_TESTING: 'true'
      E2E_FIXTURE_KEY: ${{ secrets.E2E_FIXTURE_KEY }}
      E2E_BASE_URL: ${{ inputs.deployment_url }}
      SITE_URL: ${{ inputs.deployment_url }}
      BETTER_AUTH_URL: ${{ inputs.deployment_url }}
      CONVEX_URL: ${{ needs.readiness.outputs.convex_url }}
      NEXT_PUBLIC_CONVEX_URL: ${{ needs.readiness.outputs.convex_url }}
    steps:
      - name: Require configured fixture access
        run: |
          if [ "${#E2E_FIXTURE_KEY}" -lt 32 ]; then
            echo '::error::E2E_FIXTURE_KEY is missing or invalid; authenticated verification is blocked.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @groupi/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run authenticated suite
        run: pnpm e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            packages/web/e2e/playwright-report/
            packages/web/e2e/test-results/
          retention-days: 7
